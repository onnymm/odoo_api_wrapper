[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "odoo_api_wrapper"
version = "0.1.0.a3"
authors = [
    {name = "Pável Hernández Reza", email = "phr2807@gmail.com" }]
